{% extends 'base.html' %}

{% block title %}Confirm Delete Asset | LMT Portal{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <div class="glass-panel" style="padding: 2.5rem; text-align: center;">
        <div style="width: 64px; height: 64px; border-radius: 20px; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: #fda4af; display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 1.25rem;">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>

        <h2 style="font-size: 1.4rem; margin-bottom: 0.5rem;">Delete Asset Confirmation</h2>
        <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 1.5rem;">
            Are you sure you want to delete <strong style="color: white;">"{{ asset.name }}"</strong> (Serial: {{ asset.serial_no }})? This action cannot be undone.
        </p>

        <form method="post" style="display: flex; gap: 12px; justify-content: center;">
            {% csrf_token %}
            <a href="{% url 'registered_assets' %}" class="btn-lmt btn-secondary-glass" style="flex: 1; padding: 0.75rem;">Cancel</a>
            <button type="submit" class="btn-lmt btn-danger-glass" style="flex: 1; padding: 0.75rem; background: var(--accent-rose); color: white;">
                <i class="fa-solid fa-trash me-1"></i> Delete Asset
            </button>
        </form>
    </div>
</div>
{% endblock %}
